name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the official registry
        run: python -c "from nullshort import registry; r = registry.load_file(registry.BUNDLED); print(f'registry v{r.version}: {len(r.entries)} apps OK')"
