# Null//Short official registry
#
# Hand-picked short codes for popular apps. Apps not listed here still get an
# automatic 5-arrow code, so this list only needs the apps worth a short one.
#
# Rules: codes are ↑ + 2–3 arrows; the 2nd arrow is the family; codes and
# desktop IDs must be unique. Once published, a code never changes.
#
#   ↑ ↑  dev & system     ↑ →  internet     ↑ ↓  games     ↑ ←  media & other
#
# Want an app added?  null-short submit <desktop-id>
# Bump `version` with every change so clients pick up the update.

version = 1

# ---------------------------------------------------------------- ↑ → internet
