# null-short config
#
# Hold the trigger key, tap an arrow code, let go. If the code matches, it fires.
#
# Where codes come from (first one wins):
#   1. [[code]] entries in this file
#   2. the official registry (short codes for popular apps)
#   3. automatic codes for every other installed app (↑ + family + 3 arrows)
#
# See all your codes:  null-short list
# Your own copy lives at ~/.config/null-short/config.toml and overrides this one.
# After editing:  null-short check   then   systemctl --user restart null-short

trigger = "KEY_CAPSLOCK"   # any evdev key name, e.g. KEY_RIGHTALT, KEY_F13
tap_passthrough = true     # a quick tap with no arrows still does the key's normal job
auto_apps = true           # give every installed app an automatic code
sounds = true              # success / fail sounds
notify = false             # desktop notification on fail

# Your own codes. Codes can be arrows (↑ ↓ ← →), words (up down left right)
# or letters (U D L R). Each needs `apps` (.desktop IDs, tried in order),
# `run` (a command) or `url`.
#
# [[code]]
# name = "NULL // PLAY"
# seq  = "↓ ↓ ↑"
# run  = "gamemode"
#
# Override a registry code, e.g. give Firefox something else:
# [[code]]
# name = "Firefox"
# seq  = "→ →"
# apps = ["firefox-esr", "org.mozilla.firefox"]
